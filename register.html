
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | E-Complaints UiTM</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="register-page">

    <div class="register-card">

        <!-- UiTM Logo -->
        <div class="register-logo">
            <img src="images/logo-uitm.png" alt="UiTM Logo">
        </div>

        <!-- Heading -->
        <div class="register-heading">
            <h1>Create Your Account</h1>
            <p>Register for E-Complaints Student Portal</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your student ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">UiTM Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your UiTM email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regUsername">Username</label>
                <input
                    type="text"
                    id="regUsername"
                    placeholder="Create a username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required>

                    <label class="show-password">
                        <input type="checkbox" class="toggle-password" data-target="regPassword">
                        Show Password
                    </label>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

                    <label class="show-password">
                        <input type="checkbox" class="toggle-password" data-target="confirmPassword">
                        Show Password
                    </label>
            </div>

            <button type="submit" class="register-btn">
                CREATE ACCOUNT →
            </button>

            <p id="registerMessage" class="register-message"></p>

        </form>

        <!-- Login Link -->
        <div class="register-login">
            <p>Already have an account?</p>
            <a href="index.html">Login Here</a>
        </div>

        <!-- Homepage Link -->
        <div class="register-home">
            <a href="index.html">← Back to Homepage</a>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
